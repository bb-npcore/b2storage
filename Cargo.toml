[package]
name = "b2storage"
version = "2.0.0"
edition = "2021"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.29"
rfd = "0.15"

# Async
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"

# Utils
anyhow = "1"
dirs = "6"
bytes = "1"
bytesize = "1"
lzma-rs = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"

# Credential files are encrypted with Windows DPAPI, so they are only readable by
# the Windows user that saved them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# build.rs decompresses and hashes the vendored Mesa payload.
[build-dependencies]
sha2 = "0.10"
lzma-rs = "0.3"

# Build scripts default to opt-level 0, which makes hashing ~76 MB take far too long.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
