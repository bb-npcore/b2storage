[package]
name = "b2storage"
version = "2.0.0"
edition = "2021"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.29"
rfd = "0.15"

# Async
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha1 = "0.10"
base64 = "0.22"

# Utils
anyhow = "1"
dirs = "6"
bytes = "1"
bytesize = "1"
lzma-rs = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
